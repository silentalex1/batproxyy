[build]
  command = "npm install && npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-YOUR-BACKEND-URL/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/proxy"
  to = "https://REPLACE-WITH-YOUR-BACKEND-URL/proxy:splat"
  status = 200
  force = true

[[redirects]]
  from = "/proxy/*"
  to = "https://REPLACE-WITH-YOUR-BACKEND-URL/proxy:splat"
  status = 200
  force = true

[[redirects]]
  from = "/cdn-cgi/*"
  to = "https://REPLACE-WITH-YOUR-BACKEND-URL/cdn-cgi/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ai/status/api"
  to = "https://REPLACE-WITH-YOUR-BACKEND-URL/ai/status/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
